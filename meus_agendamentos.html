<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Meus Agendamentos | Beauty Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --purple-600:#8B5CF6;
  --purple-700:#6B21A8;
  --card-bg:#fff;
  --card-shadow:0 8px 20px rgba(139,92,246,0.12);
  --muted:#6b5671;
  --ok:#2fa84f;
  --danger:#e05b5b;
}

/* Reset básico */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',Arial,sans-serif;}
html,body{height:100%;background:linear-gradient(135deg,#E8D6FF,#F3E9FF 60%);color:#2b2140;}

/* Sidebar */
.sidebar {
  width:260px; background:linear-gradient(180deg,rgba(155,98,214,0.95),rgba(139,92,246,0.95));
  color:white; position:fixed; height:100%; left:0; top:0; padding:25px 20px;
  transition:all 0.4s ease; box-shadow:6px 0 25px rgba(0,0,0,0.15); z-index:100;
}
.sidebar.closed{width:80px;padding:25px 10px;}
.sidebar h2{font-size:22px;text-align:center;font-weight:700;margin-bottom:40px;transition:opacity 0.3s ease;}
.sidebar.closed h2{opacity:0;pointer-events:none;}
.sidebar ul{list-style:none;}
.sidebar ul li{margin:18px 0;}
.sidebar ul li a{
  color:white;text-decoration:none;display:flex;align-items:center;gap:14px;padding:12px 15px;
  border-radius:12px;transition:0.3s;font-weight:500;background:transparent;
}
.sidebar ul li a:hover,.sidebar ul li a.active{
  background:rgba(255,255,255,0.25);
  box-shadow:0 0 12px rgba(255,255,255,0.3);
  transform:translateX(5px);
}
.sidebar ul li i{font-size:18px;transition:transform 0.3s;}
.sidebar.closed ul li span{display:none;}
.toggle-btn{
  position:absolute;right:-18px;top:20px;width:38px;height:38px;
  border-radius:50%;background:#fff;color:var(--purple-600);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);cursor:pointer;z-index:140;
}

/* Main */
.main{margin-left:260px;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .35s ease;}
.sidebar.closed + .main{margin-left:90px;}

/* Topbar */
.topbar {
  background:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-bottom:1px solid rgba(0,0,0,.04);
  position:sticky;top:0;z-index:80;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.brand{font-weight:700;color:var(--purple-700);display:flex;align-items:center;gap:8px;font-size:20px;}
.topbar-right{display:flex;align-items:center;gap:18px;}
.icon-btn{background:transparent;border:0;cursor:pointer;font-size:18px;color:var(--purple-700);}
.user-avatar {
  width:40px;height:40px;border-radius:50%;
  background:url('img/logo.jpg') center/cover;
  border:2px solid #C4B5FD;
}

/* Conteúdo */
main{
  padding:40px 28px 80px;
  flex:1;
  max-width:1150px;
  margin:0 auto;
}
h1{color:var(--purple-700);font-size:1.8rem;text-align:center;margin-bottom:6px;}
p.lead{text-align:center;color:#6b5671;margin-bottom:18px;}

/* Search Row */
.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.search{
  display:flex;gap:8px;align-items:center;background:#F3E9FF;padding:8px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.search input{border:0;background:transparent;outline:none;padding:6px 8px;font-size:0.95rem;width:260px}
.filter{display:flex;gap:8px}
select, button.small{
  padding:8px 10px;border-radius:5px;border:1px solid rgba(0,0,0,0.06);background:white;cursor:pointer;font-weight:600;
}

/* Card wrapper para tabela */
.card{background:var(--card-bg);border-radius:10px;padding:24px;box-shadow:var(--card-shadow);margin:8px 0;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
thead th{position:sticky;top:0;background:var(--purple-600);color:white;padding:12px 10px;text-align:center;font-weight:700;font-size:0.95rem;}
tbody td{padding:12px 10px;border-bottom:1px solid #f0eaf5;text-align:center;color:#3a2841;font-size:0.95rem}
tbody tr:hover{background:#faf2ff}

.actions{display:flex;gap:8px;justify-content:center}
.btn{padding:8px 12px;border-radius:5px;border:0;cursor:pointer;font-weight:700}
.btn.edit{background:var(--purple-600);color:white}
.btn.cancel{background:var(--danger);color:white}
.btn.reagendar{background:var(--purple-600);color:white}
.status{font-weight:700;padding:6px 10px;border-radius:5px;display:inline-block}
.status.agendado{background:rgba(47,168,79,0.12);color:var(--ok)}
.status.concluido{background:rgba(107,86,112,0.08);color:#6b5671}
.status.cancelado{background:rgba(224,91,91,0.12);color:var(--danger)}

/* Empty state */
.empty{padding:30px;text-align:center;color:var(--purple-600)}

/* Footer */
footer {
  padding:26px;
  text-align:center;
  color:var(--purple-700);
  border-top:1px  rgba(0,0,0,0.05);
}

/* Responsive */
@media(max-width:750px){
  .search input{width:100%}
  main{padding:30px 20px 70px;}
}
.search {
  display: flex;
  gap: 8px;
  align-items: center;
  background: #fff;           /* Fundo branco de todo o container */
  padding: 6px 10px;          /* Espaçamento interno */
  border-radius: 8px;         /* Mais quadrado */
  border: 1px solid #ccc;     /* Borda leve */
  box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Sombra suave */
}

.search input {
  border: none;               /* Sem borda própria */
  background: transparent;    /* Transparente para herdar o branco do pai */
  outline: none;
  padding: 6px 8px;
  font-size: 0.95rem;
  flex: 1;                    /* Ocupa o máximo do container */
}

</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="toggle-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
  <h2>Beauty Hub</h2>
  <ul>
    <li><a href="cliente_home.html"><i class="fa-solid fa-house"></i><span> Início</span></a></li>
     <li><a href="agendar.html"><i class="fa-solid fa-clock"></i><span> Agende Seu Horarios</span></a></li>
    <li><a href="meus_agendamentos.html" class="active"><i class="fa-solid fa-calendar-days"></i><span> Meus Agendamentos</span></a></li>
    <li><a href="perfil.html"><i class="fa-solid fa-user"></i><span> Perfil</span></a></li>
    <li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i><span> Sair</span></a></li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="brand"><i class="fa-solid fa-sparkles"></i> Beauty Hub</div>
    <div class="topbar-right">
      <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
      <button class="icon-btn"><i class="fa-regular fa-envelope"></i></button>
      <div class="user-avatar"></div>
    </div>
  </div>

  <main>
    <h1>Meus Agendamentos</h1>
    <p class="lead">Confira, filtre, edite ou cancele seus agendamentos.</p>

    <div class="controls">
      <div class="search" title="Pesquisar por nome do profissional ou serviço">
        🔍 <input id="searchInput" placeholder="Pesquisar (profissional, serviço ou data dd/mm/aaaa)" />
      </div>

      <div class="filter">
        <select id="filterStatus" title="Filtrar por status">
          <option value="all">Todos</option>
          <option value="Agendado">Agendado</option>
          <option value="Concluído">Concluído</option>
          <option value="Cancelado">Cancelado</option>
        </select>
        <button class="small" id="clearFilters">Limpar</button>
      </div>
    </div>

    <div class="card">
      <table aria-label="Meus Agendamentos">
        <thead>
          <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Profissional</th>
            <th>Serviço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="agendamentosBody"></tbody>
      </table>

      <div id="emptyMsg" class="empty" style="display:none">Você não possui agendamentos.</div>
    </div>
  </main>

  <footer>© 2025 Beauty Hub - Todos os direitos reservados.</footer>
</div>

<script>
function toggleMenu(){
  document.querySelector('.sidebar').classList.toggle('closed');
}

/* ---------- Dados iniciais / storage ---------- */
const storageKey = 'tb_bookings_list_v2';
let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
if(!list || list.length === 0){
  list = [
    {date:'2025-11-05', time:'10:00', prof:'Marília Andrade', service:'Corte Feminino', status:'Agendado'},
    {date:'2025-11-07', time:'14:00', prof:'João Silva', service:'Barba Completa', status:'Agendado'},
    {date:'2025-09-12', time:'16:00', prof:'Ana Paula', service:'Manicure', status:'Concluído'}
  ];
  localStorage.setItem(storageKey, JSON.stringify(list));
}

/* ---------- Helpers ---------- */
function formatDateBR(isoDate){return isoDate.split('-').reverse().join('/');}
function isFutureOrToday(isoDate, time){
  const [y,m,d] = isoDate.split('-').map(Number);
  const [hh,mm] = (time||'00:00').split(':').map(Number);
  const dt = new Date(y,m-1,d,hh,mm,0);
  const now = new Date();
  return dt >= new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0);
}

/* ---------- Render ---------- */
const tbody = document.getElementById('agendamentosBody');
const emptyMsg = document.getElementById('emptyMsg');
const searchInput = document.getElementById('searchInput');
const filterStatus = document.getElementById('filterStatus');
const clearFiltersBtn = document.getElementById('clearFilters');

function renderAgendamentos(){
  tbody.innerHTML = '';
  const query = (searchInput.value || '').trim().toLowerCase();
  const statusFilter = filterStatus.value;
  const filtered = list.filter((b) => {
    if(statusFilter !== 'all' && b.status !== statusFilter) return false;
    if(!query) return true;
    const dateBR = formatDateBR(b.date);
    return (b.prof + ' ' + b.service + ' ' + dateBR + ' ' + b.time).toLowerCase().includes(query);
  });

  if(filtered.length === 0){
    emptyMsg.style.display = 'block';
    return;
  } else {
    emptyMsg.style.display = 'none';
  }

  filtered.sort((a,b) => new Date(`${a.date}T${a.time}:00`) - new Date(`${b.date}T${b.time}:00`));

  filtered.forEach((b) => {
    const tr = document.createElement('tr');
    let status = b.status || (isFutureOrToday(b.date,b.time) ? 'Agendado' : 'Concluído');
    if(b.status === 'Agendado' && !isFutureOrToday(b.date,b.time)) status = 'Concluído';
    const statusClass = status === 'Agendado' ? 'agendado' : (status === 'Cancelado' ? 'cancelado' : 'concluido');

    tr.innerHTML = `
      <td>${formatDateBR(b.date)}</td>
      <td>${b.time}</td>
      <td>${b.prof}</td>
      <td>${b.service}</td>
      <td><span class="status ${statusClass}">${status}</span></td>
      <td class="actions">
        <button class="btn edit">✏️</button>
        <button class="btn cancel">❌</button>
        <button class="btn reagendar" style="display:none">🔁</button>
      </td>
    `;
    tbody.appendChild(tr);

    const editBtn = tr.querySelector('.edit');
    const cancelBtn = tr.querySelector('.cancel');
    const reagendarBtn = tr.querySelector('.reagendar');

    if(status==='Concluído' || status==='Cancelado'){
      editBtn.disabled = true; cancelBtn.disabled = true;
      editBtn.style.opacity=0.5; cancelBtn.style.opacity=0.5;
      editBtn.style.cursor='not-allowed'; cancelBtn.style.cursor='not-allowed';
      if(status==='Cancelado') reagendarBtn.style.display='inline-block';
    } else {
      editBtn.addEventListener('click', ()=>{
        const newTime = prompt('Digite a nova hora (ex: 10:00):', b.time);
        if(newTime && /^\d{2}:\d{2}$/.test(newTime)){ b.time=newTime; localStorage.setItem(storageKey, JSON.stringify(list)); renderAgendamentos(); }
        else if(newTime!==null) alert('Formato inválido. Use HH:MM.');
      });
      cancelBtn.addEventListener('click', ()=>{
        if(confirm('Deseja realmente cancelar este agendamento?')){ b.status='Cancelado'; localStorage.setItem(storageKey, JSON.stringify(list)); renderAgendamentos(); }
      });
    }

    reagendarBtn.addEventListener('click', ()=>{
      const newDate = prompt('Nova data (AAAA-MM-DD):', b.date);
      if(!newDate) return;
      const newTime = prompt('Nova hora (HH:MM):', b.time);
      if(!newTime) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(newDate) || !/^\d{2}:\d{2}$/.test(newTime)){ alert('Formato inválido. Data: AAAA-MM-DD. Hora: HH:MM'); return; }
      b.date=newDate; b.time=newTime; b.status='Agendado';
      localStorage.setItem(storageKey, JSON.stringify(list)); renderAgendamentos();
    });
  });
}

searchInput.addEventListener('input',()=>renderAgendamentos());
filterStatus.addEventListener('change',()=>renderAgendamentos());
clearFiltersBtn.addEventListener('click',()=>{searchInput.value=''; filterStatus.value='all'; renderAgendamentos();});

renderAgendamentos();
</script>
</body>
</html>
