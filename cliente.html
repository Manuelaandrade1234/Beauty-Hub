<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clientes | Beauty Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --purple-600:#8B5CF6; --purple-700:#6B21A8; --accent:#A36AD9;
  --card-shadow:0 10px 30px rgba(139,92,246,0.12);
  --glass:rgba(255,255,255,0.95);
  --ok:#2fa84f; --danger:#e05b5b; --neutral:#6b5671;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:linear-gradient(135deg,#E8D6FF,#F3E9FF);min-height:100vh;display:flex;overflow:hidden;}
.sidebar{width:260px;background: linear-gradient(180deg, rgba(155,98,214,0.95), rgba(139,92,246,0.95));backdrop-filter: blur(8px); color:white; position: fixed; height:100%; left:0; top:0; padding:25px 20px; transition: all 0.4s ease; box-shadow:6px 0 25px rgba(0,0,0,0.15); z-index:100;}
.sidebar.closed{width:80px;padding:25px 10px;}
.sidebar h2{font-size:22px;text-align:center;font-weight:700;margin-bottom:40px;transition:opacity 0.3s ease;}
.sidebar.closed h2{opacity:0;pointer-events:none;}
.sidebar ul{list-style:none;}
.sidebar ul li{margin:18px 0;}
.sidebar ul li a{color:white;text-decoration:none;display:flex;align-items:center;gap:14px;padding:12px 15px;border-radius:12px;transition:0.3s;font-weight:500;background:transparent;}
.sidebar ul li a:hover, .sidebar ul li a.active{background: rgba(255,255,255,0.25);box-shadow:0 0 12px rgba(255,255,255,0.3);transform: translateX(5px);}
.sidebar ul li i{font-size:18px; transition:transform 0.3s;}
.sidebar.closed ul li span{display:none;}
.toggle-btn{position:absolute;right:-18px;top:20px;width:38px;height:38px;border-radius:50%; background:#fff;color:var(--purple-600);display:flex;align-items:center;justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.12);cursor:pointer;z-index:140;}
.main{margin-left:260px;flex:1;display:flex;flex-direction:column;transition:margin-left .35s ease;}
.sidebar.closed + .main{margin-left:90px}
.topbar{background:var(--glass); display:flex;align-items:center;justify-content:space-between; padding:14px 22px;border-bottom:1px solid rgba(0,0,0,.04); position:sticky;top:0;z-index:80; backdrop-filter: blur(4px);}
.topbar h1{color:var(--purple-700);font-size:22px;margin-bottom:6px; }
.controls{display:flex;align-items:center;gap:10px;}
.search{display:flex;align-items:center;gap:10px;background:#F6F0FF;padding:10px 12px;border-radius:5px;box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);}
.search input{border:0;background:transparent;outline:none;width:220px;font-size:14px;color: var(--purple-700);}
.btn-small{padding:6px 10px;border-radius:5px;border:0;cursor:pointer;font-weight:600}
.btn-small.primary{background:var(--purple-600);color:white;}
.layout{display:grid;grid-template-columns:1fr 350px;gap:22px;align-items:start;padding:20px;}
.panel{background:var(--glass);border-radius:5px;padding:18px;box-shadow:var(--card-shadow);overflow:visible;}
.panel {background: var(--glass);border-radius: 5px;box-shadow: var(--card-shadow);max-width: 1370px; width: 143%;}
.table{width:100%;border-collapse:collapse}
.table thead th{font-size:13px;text-align:left;padding:10px 8px;color:#6b21a8;border-bottom:1px solid #8c00ff}
.table tbody td{padding:12px 8px;border-bottom:1px dashed #6b21a8;vertical-align:middle;font-size:14px;color:#3f2a66}
.status{font-weight:700;padding:4px 8px;border-radius:5px;display:inline-block;font-size:12px}
.status.ativo{background:rgba(47,168,79,0.12);color:var(--ok);}
.status.inativo{background:rgba(224,91,91,0.12);color:var(--danger);}
.actions{display:flex;gap:8px;}
.modal-overlay{position:fixed;inset:0;background:rgba(11,6,23,0.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:220;overflow:auto;}
.modal{background:#fff;border-radius:5px;padding:18px;max-width:600px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.28);max-height:90vh;overflow:auto;}
.modal h3{color:var(--purple-700);margin-bottom:12px}
.modal input, .modal select, .modal textarea{width:100%;margin-bottom:10px;padding:8px 10px;border-radius:5px;border:1px solid rgba(0,0,0,0.1);outline:none;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;}
.service-photo{width:100%;border-radius:8px;margin-bottom:6px;object-fit:cover;}
.photo-container img{width:80px;margin-right:6px;border-radius:6px;}
h1{color:var(--purple-700);font-size:22px;margin-bottom:6px; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.main {
  flex: 1; /* ocupa o espaço restante */
}

footer {
  padding: 26px;
  text-align: center;
  color: #6B21A8;
}

  .btn-small {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    margin: 2px;
    color: white;
    transition: 0.2s;
  }

  .edit { background-color: #a75ef5; }      /* roxo */
  .edit:hover { background-color: #7d0af8; }

  .delete { background-color: #e05b5b; }    /* vermelho */
  .delete:hover { background-color: #c04a4a; }

  .anamnese { background-color: #f8e003; }  /* verde */
  .anamnese:hover { background-color: #e4cd02; }

  .status.ativo { background-color: #2fa84f; color:white; padding:4px 8px; border-radius:5px; }
  .status.inativo { background-color: #e05b5b; color:white; padding:4px 8px; border-radius:5px; }

</style>
</head>
<body>

<div class="sidebar">
  <div class="toggle-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
  <h2>Beauty Hub</h2>
  <ul>
    <li><a href="admin_home.html"><i class="fa-solid fa-house"></i><span> Início</span></a></li>
    <li><a href="agenda.html"><i class="fa-solid fa-clock"></i><span>Agendar Horario do Cliente</span></a></li>
    <li><a href="cliente.html" class="active"><i class="fa-solid fa-users"></i><span>Clientes</span></a></li>
    <li><a href="pdv.html"><i class="fa-solid fa-cash-register"></i><span> PDV</span></a></li>
    <li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i><span> Sair</span></a></li>
  </ul>
</div>

<div class="main">
  <div class="topbar">
    <h1>Beauty Hub</h1>
    <div class="controls">
      <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Pesquisar por cliente..." /></div>
      <button class="btn-small primary" id="newClient">➕ Novo Cliente</button>
    </div>
  </div>

  <div class="layout">
    <section class="panel">
      <table class="table">
        <h1>👥 Clientes:</h1>
        <thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="clientsBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty" style="display:none">Nenhum cliente cadastrado</div>
    </section>
  </div>
</div>

<!-- Modal Cliente -->
<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <h3>Cadastro / Edição de Cliente</h3>
    <input type="text" id="clientName" placeholder="Nome completo">
    <input type="email" id="clientEmail" placeholder="Email">
    <input type="text" id="clientPhone" placeholder="Telefone">
    <input type="date" id="clientDOB" placeholder="Data de nascimento">
    <select id="clientStatus">
      <option value="Ativo">Ativo</option>
      <option value="Inativo">Inativo</option>
    </select>
    <input type="text" id="clientAddress" placeholder="Endereço">
    <input type="text" id="clientProfession" placeholder="Profissão">
    <select id="clientGender">
      <option value="">Gênero</option>
      <option value="Masculino">Masculino</option>
      <option value="Feminino">Feminino</option>
      <option value="Outro">Outro</option>
    </select>
    <input type="text" id="clientDocument" placeholder="CPF / RG">
    <textarea id="clientNotes" placeholder="Observações"></textarea>
    <div class="modal-actions">
      <button class="btn-small" id="clientCancel">Cancelar</button>
      <button class="btn-small primary" id="clientSave">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Anamnese -->
<div class="modal-overlay" id="anamneseModal">
  <div class="modal">
    <h3>Ficha de Anamnese</h3>
    <textarea id="anamnesisHistory" placeholder="Histórico de saúde (doenças, alergias, medicamentos)"></textarea>
    <textarea id="anamnesisTreatment" placeholder="Tratamentos em andamento"></textarea>
    <textarea id="anamnesisPast" placeholder="Procedimentos anteriores"></textarea>
    <textarea id="anamnesisObservations" placeholder="Observações do profissional"></textarea>
    <input type="date" id="anamnesisLastVisit">
    <input type="text" id="anamnesisFrequency" placeholder="Frequência de visitas">
    <input type="text" id="anamnesisGoals" placeholder="Objetivos do cliente">
    <input type="file" id="anamnesisPhoto" accept="image/*" multiple>
    <div class="photo-container" id="photoPreviewContainer"></div>
    <div class="modal-actions">
      <button class="btn-small" id="anamnesisCancel">Cancelar</button>
      <button class="btn-small primary" id="anamnesisSave">Salvar</button>
    </div>
  </div>
</div>

<script>
const LS_CLIENTS='bh_clients_v2';
let clients=JSON.parse(localStorage.getItem(LS_CLIENTS)||'[]');
let editingClient=null;
let editingAnamnese=null;

const clientsBody=document.getElementById('clientsBody');
const emptyMsg=document.getElementById('emptyMsg');

function renderClients(){
  clientsBody.innerHTML='';
  if(clients.length===0){ emptyMsg.style.display='block'; return; }
  emptyMsg.style.display='none';
  clients.forEach(c=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${c.name}</td><td>${c.email}</td><td>${c.phone}</td>
      <td><span class="status ${c.status==='Ativo'?'ativo':'inativo'}">${c.status}</span></td>
      <td class="actions">
        <button class="btn-small edit">✏️ Editar</button>
        <button class="btn-small delete">❌ Excluir</button>
        <button class="btn-small anamnese">📋 Anamnese</button>
      </td>`;
    clientsBody.appendChild(tr);

    tr.querySelector('.edit').onclick=()=>{ editingClient=c; openClientModal(c); }
    tr.querySelector('.delete').onclick=()=>{ if(confirm('Deseja excluir este cliente?')){ clients=clients.filter(cli=>cli!==c); saveClients(); } }
    tr.querySelector('.anamnese').onclick=()=>{ editingAnamnese=c; openAnamneseModal(c); }
  });
}

function saveClients(){ localStorage.setItem(LS_CLIENTS,JSON.stringify(clients)); renderClients(); }

const clientModal=document.getElementById('clientModal');
const anamnesisModal=document.getElementById('anamneseModal');

document.getElementById('newClient').onclick=()=>openClientModal();

function openClientModal(c){
  clientModal.style.display='flex';
  document.getElementById('clientName').value=c?.name||'';
  document.getElementById('clientEmail').value=c?.email||'';
  document.getElementById('clientPhone').value=c?.phone||'';
  document.getElementById('clientDOB').value=c?.dob||'';
  document.getElementById('clientStatus').value=c?.status||'Ativo';
  document.getElementById('clientNotes').value=c?.notes||'';
  document.getElementById('clientAddress').value=c?.address||'';
  document.getElementById('clientProfession').value=c?.profession||'';
  document.getElementById('clientGender').value=c?.gender||'';
  document.getElementById('clientDocument').value=c?.document||'';
}
document.getElementById('clientCancel').onclick=()=>{ clientModal.style.display='none'; editingClient=null; }
document.getElementById('clientSave').onclick=()=>{
  const c={
    name:document.getElementById('clientName').value,
    email:document.getElementById('clientEmail').value,
    phone:document.getElementById('clientPhone').value,
    dob:document.getElementById('clientDOB').value,
    status:document.getElementById('clientStatus').value,
    notes:document.getElementById('clientNotes').value,
    address:document.getElementById('clientAddress').value,
    profession:document.getElementById('clientProfession').value,
    gender:document.getElementById('clientGender').value,
    document:document.getElementById('clientDocument').value,
    anamnese: editingClient?.anamnese || {}
  };
  if(editingClient){ Object.assign(editingClient,c); } else { clients.push(c); }
  saveClients();
  clientModal.style.display='none';
  editingClient=null;
}

// Anamnese
function openAnamneseModal(c){
  anamnesisModal.style.display='flex';
  document.getElementById('anamnesisHistory').value=c.anamnese?.history||'';
  document.getElementById('anamnesisTreatment').value=c.anamnese?.treatment||'';
  document.getElementById('anamnesisPast').value=c.anamnese?.pastProcedures||'';
  document.getElementById('anamnesisObservations').value=c.anamnese?.observations||'';
  document.getElementById('anamnesisLastVisit').value=c.anamnese?.lastVisit||'';
  document.getElementById('anamnesisFrequency').value=c.anamnese?.frequency||'';
  document.getElementById('anamnesisGoals').value=c.anamnese?.goals||'';

  const container=document.getElementById('photoPreviewContainer');
  container.innerHTML='';
  if(c.anamnese?.photos){
    c.anamnese.photos.forEach(src=>{
      const img=document.createElement('img');
      img.src=src; img.className='service-photo';
      container.appendChild(img);
    });
  }
}

document.getElementById('anamnesisCancel').onclick=()=>{ anamnesisModal.style.display='none'; editingAnamnese=null; }
document.getElementById('anamnesisSave').onclick=()=>{
  if(editingAnamnese){
    const files=document.getElementById('anamnesisPhoto').files;
    const photos=editingAnamnese.anamnese?.photos || [];
    for(let i=0;i<files.length;i++){
      photos.push(URL.createObjectURL(files[i]));
    }
    editingAnamnese.anamnese={
      history: document.getElementById('anamnesisHistory').value,
      treatment: document.getElementById('anamnesisTreatment').value,
      pastProcedures: document.getElementById('anamnesisPast').value,
      observations: document.getElementById('anamnesisObservations').value,
      lastVisit: document.getElementById('anamnesisLastVisit').value,
      frequency: document.getElementById('anamnesisFrequency').value,
      goals: document.getElementById('anamnesisGoals').value,
      photos
    };
  }
  saveClients();
  anamnesisModal.style.display='none';
  editingAnamnese=null;
}

// Search
document.getElementById('searchInput').oninput=()=>{ 
  const q=document.getElementById('searchInput').value.toLowerCase();
  clientsBody.querySelectorAll('tr').forEach(tr=>{
    const name=tr.children[0].textContent.toLowerCase();
    tr.style.display=name.includes(q)?'table-row':'none';
  });
}

// Toggle menu
function toggleMenu(){ document.querySelector('.sidebar').classList.toggle('closed'); }

renderClients();
</script>
  <footer>© 2025 Beauty Hub - Todos os direitos reservados.</footer>
</body>
</html>
